<!doctype html>
<html lang="en" class="no-js">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="author" content="Nobel Dahal" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="alternate" type="application/rss+xml" title="Nobel Dahal · Writing" href="/feed.xml" />
    <link rel="me" href="https://github.com/coderkoala" />
    <link rel="me" href="https://www.linkedin.com/in/coderkoala" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="author" href="/humans.txt" />
    <meta name="format-detection" content="telephone=no" />
    <script>
      document.documentElement.classList.remove('no-js')
      document.documentElement.dataset.device = matchMedia('(max-width: 767.98px), (pointer: coarse) and (max-height: 500px)').matches ? 'mobile' : 'desktop'
      document.documentElement.dataset.orientation = innerWidth > innerHeight ? 'landscape' : 'portrait'
      try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t } catch (e) {}
      try { const a = JSON.parse(localStorage.getItem('a11y') || '{}'), d = { text: 'md', contrast: 'normal', motion: 'auto', links: 'auto', spacing: 'normal' }
        for (const k in a) if (a[k] !== d[k]) document.documentElement.dataset['a11y' + k[0].toUpperCase() + k.slice(1)] = a[k] } catch (e) {}
      if (location.pathname === '/' && location.hash) {
        const to = { '#portfolio': '/work/', '#experience': '/about', '#education': '/about', '#skills': '/about', '#contact': '/hire', '#feedback': '/hire' }[location.hash]
        if (to) location.replace(to)
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
