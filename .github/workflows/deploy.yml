name: Build and publish to master

# Source lives on vue-rewrite. GitHub Pages serves master as-is, so this
# builds the site and commits the output to master.
on:
  push:
    branches: [vue-rewrite]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit the build to master
        run: |
          git fetch origin master
          git worktree add ../out origin/master
          cd ../out
          git rm -rq --ignore-unmatch . >/dev/null
          cp -a "$GITHUB_WORKSPACE/dist/." .
          git add -A
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Deploy ${GITHUB_SHA::7}"
          git push origin HEAD:master
